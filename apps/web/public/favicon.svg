  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#5a4f3d" stroke-width="2"/>
  <g fill="#f2d35b">
    <rect x="10" y="6" width="12" height="2"/>
    <rect x="8" y="8" width="2" height="2"/><rect x="22" y="8" width="2" height="2"/>
    <rect x="6" y="10" width="2" height="12"/><rect x="24" y="10" width="2" height="12"/>
    <rect x="8" y="22" width="2" height="2"/><rect x="22" y="22" width="2" height="2"/>
    <rect x="10" y="24" width="12" height="2"/>
    <rect x="11" y="12" width="3" height="3"/><rect x="18" y="12" width="3" height="3"/>
    <rect x="10" y="18" width="2" height="2"/><rect x="20" y="18" width="2" height="2"/>
    <rect x="12" y="20" width="8" height="2"/>
  </g>
